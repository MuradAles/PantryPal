services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Points at the mounted volume so memory survives container restarts.
      DATABASE_PATH: /data/pantrypal.db
    ports:
      - "8000:8000"
    volumes:
      - pantrypal-data:/data
      # Source is mounted over the copy baked into the image so edits take effect
      # without a rebuild. The image still contains a full copy, so `docker build`
      # alone produces a working container for anyone cloning this repo.
      - ./backend/app:/srv/app
      - ./backend/tests:/srv/tests
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      # The dev server proxies /api to this, so the browser only ever talks to
      # its own origin and no API URL is baked into the bundle.
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      # Same trick as the backend: source is mounted so edits need no rebuild.
      # The whole directory rather than individual files, because a single-file
      # bind mount keeps the old inode when an editor rewrites the file and the
      # container then reads a stale copy. The anonymous volume keeps the
      # node_modules installed in the image from being hidden by the host mount.
      # Compose carries that anonymous volume across a recreate, so after a
      # dependency change `up --build` alone leaves the old modules in place:
      # run `docker compose rm -sfv frontend` first to drop it.
      - ./frontend:/srv
      - /srv/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pantrypal-data:
