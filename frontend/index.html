<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline and percent-encoded: no binary asset to carry, no 404 in the
         console, and no raw angle brackets for the HTML parser to trip on. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E"
    />
    <!-- The three faces the mockup names: Literata for recipe prose, Hanken
         Grotesk for UI, Material Symbols for the icons. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@6..72,400;6..72,600;6..72,700&family=Hanken+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <title>PantryPal</title>
  </head>
  <body class="font-ui-main text-ui-main">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
